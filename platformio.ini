; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; PlatformIO Project Configuration File

[env:esp32s3]
platform = espressif32 @ ^6.6.0  ; 锁定 3.x 稳定版编译平台
board = esp32-s3-devkitc-1       ; 🌟 核心修改：改为最万能、绝不报错的官方标准原生板 ID
framework = arduino
monitor_speed = 115200

; ============================================================================
; 当前目标板：Waveshare ESP32-S3-Touch-LCD-2.8（V1，ST7789T3 + CST328）
; 即 CLAUDE.md §2 一开始就写明的正式硬件，2026-09-15 到货，取代此前的临时板
; Hosyond ES3C28P（见 board/hosyond-esp32-s3-2.8 分支）。
;
; ⚠️ 管脚来源：Waveshare 官方 wiki 的引脚表不全（docs.waveshare.com 只列出
; 12PIN 外接排线：SCL=10 / SDA=11 / TXD=43 / RXD=44 / 备用 15、18），因此
; 下面每一个管脚都取自厂商自己的 Arduino 驱动源码：
;   https://github.com/jeffvan302/WS_ESP32_Touch28/tree/HEAD/src
; （Display_ST7789.h / Touch_CST328.h / SD_Card.h / BAT_Driver.h / PWR_Key.h /
;   I2C_Driver.h / Audio_PCM5101.h）——那是 Waveshare 官方 demo 整理成的库，
; 与上述 12PIN 表互相印证（I2C 10/11 两处完全一致）。
;
; ⚠️ 不要拿 deps/Waveshare-LCD-2.8 当本板的参考：那个子模块实际上是
; ESP32-S3-Touch-LCD-2.8**B**（480x640 ST7701 RGB 并口 + GT911 + TCA9554
; 扩展器），和本板（240x320 ST7789 SPI + CST328）是两块完全不同的板子。
; CLAUDE.md §6 对该子模块的描述（"ST7789/FT6336/QMI8658"）是错的，已更正。
;
; 本板与 Hosyond 板的管脚**无一相同**，唯一相同的是 240x320 分辨率与
; 16MB Flash / 8MB Octal PSRAM，所以 UI 布局、lv_conf.h、字体全部不变。
; ============================================================================
board_build.arduino.memory_type = qio_opi   ; ESP32-S3R8：16MB Flash (QIO) + 8MB Octal PSRAM (OPI)
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; C++17：原为 deps/esp32-ant 的要求，该子模块已移除；现由 src/ 自身的代码依赖
; （constexpr 构造、结构化绑定等），保留不变。
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D BOARD_HAS_PSRAM          ; 必须！启用板载 8MB PSRAM，运行图形 UI 内存必选
    -D ARDUINO_USB_CDC_ON_BOOT=1 ; 允许通过板载 Type-C 直接在电脑终端打印串口日志

    ; LVGL 配置头定位：让 lvgl 改用 #include "lv_conf.h"，而非默认的相对路径
    ; "../../lv_conf.h"（那会去 .pio/libdeps/esp32s3/ 下找，必然失败）。
    ; ⚠️ 仅加此宏不够：include/ 默认只对 src/ 生效，编译 .pio/libdeps 下的 lvgl
    ; 库时依然找不到 lv_conf.h，会静默回落到 LVGL 自带默认值（色深、字体全错），
    ; 症状是链接期 undefined reference to `lv_font_montserrat_24'。
    ; 所以必须再显式 -I include，让库的编译单元命中同一份 lv_conf.h。
    -D LV_CONF_INCLUDE_SIMPLE
    -I include

    ; ---- 屏幕：ST7789T3，SPI 四线（Display_ST7789.h）----
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1          ; 显示驱动芯片（Hosyond 板是 ILI9341，本板不是）
    ; ⚠️ 这里刻意**不**定义 TFT_INVERSION_ON：TFT_eSPI 的 ST7789_Init.h 自己就会
    ; 发 INVON（ST7789 IPS 屏出厂即需反相），Hosyond 分支那条宏是为 ILI9341V 加的。
    ; 若实测颜色整体取反（深色背景发白、绿变紫），改加 -D TFT_INVERSION_OFF=1。
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=45              ; LCD_MOSI / LCD_SDA
    -D TFT_SCLK=40              ; LCD_SCK
    -D TFT_MISO=-1              ; 面板只写不读，未引出
    -D TFT_CS=42                ; LCD_CS
    -D TFT_DC=41                ; LCD_DC
    -D TFT_RST=39              ; ⚠️ 本板有独立复位脚（Hosyond 板是 -1，随 EN 复位）
    -D TFT_BL=5                 ; LCD_BL（背光，高电平点亮；厂商用 LEDC 20kHz/10bit）
    -D LOAD_GLCD=1              ; 加载核心字体驱动
    ; 厂商 demo 跑 80MHz（Display_ST7789.h: SPIFreq 80000000）。若出现花屏/撕裂，
    ; 第一件该试的事就是降到 40000000。
    -D SPI_FREQUENCY=80000000

    ; ⚠️ 必须：让 TFT_eSPI 独占一个 SPI host（SPI3/HSPI）。
    ; 缺少此宏时，S3 分支会退化成 `SPIClass& spi = SPI;`（复用 Arduino 全局 SPI
    ; 对象），tft.begin() 会直接 panic 重启（esp_reset_reason()==4，表现为
    ; 屏幕全黑 + 无限重启）。已在 Hosyond 板实测；本板同为 S3 + TFT_eSPI，保留。
    ; 注意 SD 卡走 SDMMC 外设而非 SPI，不与此冲突。
    -D USE_HSPI_PORT

    ; ---- MAX-M10S GNSS（UART1）----
    ; 本板可用管脚极少：LCD 占 39/40/41/42/45/5，触摸占 1/2/3/4，传感器 I2C 占
    ; 10/11，SD 占 14/16/17/21，电池 8，电源键 6/7，音频 38/47/48，USB 19/20。
    ; 12PIN 排线上真正空闲的只有 GPIO15 与 GPIO18（以及 UART0 的 43/44）。
    ; 依旧不占用 43/44：CLAUDE.md §8 说明本机 USB-Serial-JTAG 串口不可用，
    ; 43/44 是唯一还能接 USB-TTL 抓日志的通道，把它让给 GNSS 等于放弃调试口。
    -D GPS_UART_RX_PIN=18       ; S3 ← 模块 TX
    -D GPS_UART_TX_PIN=15       ; S3 → 模块 RX
    -D GPS_UART_BAUD=38400      ; M10 出厂默认；M8 系列是 9600

    ; ---- 触摸：CST328（Touch_CST328.h）----
    ; ⚠️ 与 Hosyond 板的 FT6336G 不是同一类器件：CST328 是 16 位大端寄存器地址、
    ; 坐标 12 位打包在 3 字节里，寄存器图完全不同，驱动是重写的而非改管脚。
    ; 另外它挂在**独立的一条 I2C 总线**上（Wire1），传感器总线（QMI8658 IMU +
    ; PCF85063 RTC，SDA 11 / SCL 10）是另一条，留给后续提交用 Wire。
    -D TOUCH_I2C_SDA=1
    -D TOUCH_I2C_SCL=3
    -D TOUCH_INT_PIN=4
    ; RST 必须由固件主动复位：CST328 上电后不做复位时序不进正常模式。
    ; 两个管脚都在 GPIO0-21 内，属 RTC GPIO，深睡 ext0 唤醒 + gpio_hold 仍成立。
    -D TOUCH_RST_PIN=2

    ; ---- microSD：SD_MMC，**仅 1-bit**（SD_Card.h）----
    ; Hosyond 板是 4-bit（D0-D3 全引出），本板只引出 D0；D3 是一个必须由固件
    ; 拉高的普通 GPIO，不参与数据传输。GpxTrack.cpp 据此只跑 1-bit。
    -D SD_CLK_PIN=14
    -D SD_CMD_PIN=17
    -D SD_D0_PIN=16
    -D SD_D3_CTRL_PIN=21

    ; ---- 电池检测（BAT_Driver.h）----
    ; ⚠️ 分压比是 3:1，不是 Hosyond 板的 2:1；厂商还带一个 0.990476 的标定系数。
    -D BATTERY_ADC_PIN=8
    -D BATTERY_DIVIDER_NUM=3
    -D BATTERY_CAL_PERMILLE=990

    ; ---- 电源锁存（PWR_Key.h）----
    ; ⚠️ 本板电池供电时靠 GPIO7 自锁：不拉高就在松开电源键的一瞬间断电。
    ; USB 供电时轨压由 USB 维持，所以这个坑只在拔线后出现。
    -D PWR_LATCH_PIN=7
    -D PWR_KEY_PIN=6

    ; WiFi 文件传输（FileServer.h）。设为 0 可整块移除：约 420KB flash 与 21KB
    ; 静态 RAM 全部来自 WiFi 协议栈，是链接进镜像的代码与预留缓冲区，运行时开关
    ; 省不下来 —— 射频本身已经是按需启动的，关闭状态下没有额外开销可省。
    -D PEGASUS_WIFI_FILES=1

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43                                       ; ST7789 SPI 显示驱动，与上方 build_flags 的 USER_SETUP_LOADED 管脚配置对接
    lvgl/lvgl @ ^8.3.11                                             ; UI 渲染引擎（PageManager/DataCenter 架构基于此）
    h2zero/NimBLE-Arduino @ ^2.2.3                                  ; BLE 客户端：心率带 / Galaxy Watch 8 / 手机 TBT 导航
    sparkfun/SparkFun u-blox GNSS Arduino Library @ ^2.2.27         ; MAX-M10S 纯 UBX 二进制协议解析（替换 TinyGPSPlus，禁用 NMEA）

; NimBLE 版本说明：^2.2.3。最初选它是为了对齐 deps/esp32-ant 的 BLE 共存示例，
; 那个子模块已随 ANT+ 一起移除，但版本保持不变 —— 心率客户端与 TBT GATT 服务端
; 都是照 2.x API 写的，1.x→2.x 是破坏性变更，回退等于重写这两个模块。
; CLAUDE.md 第 8 节记录的几个 NimBLE 陷阱也都是在这个版本上验证的。

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; PlatformIO Project Configuration File

[env:esp32s3]
platform = espressif32 @ ^6.6.0  ; 锁定 3.x 稳定版编译平台
board = esp32-s3-devkitc-1       ; 🌟 核心修改：改为最万能、绝不报错的官方标准原生板 ID
framework = arduino
monitor_speed = 115200

; ============================================================================
; 当前目标板：Hosyond ESP32-S3 2.8" 240x320 电容触摸屏（Waveshare 到货前的临时开发板）
; 板卡基准设计型号 ES3C28P，交叉验证来源：
;   - https://github.com/celer/esphome_esp32-s3-2.8-display（该板卖家 hosyond 的 ESPHome 配置）
;   - https://github.com/ngttai/esp32_s3_es3c28p（同一 ES3C28P 参考设计的 BSP）
; ⚠️ 注意：本板与 CLAUDE.md §2 中原定的 Waveshare ESP32-S3-Touch-LCD-2.8 硬件不同
; （显示驱动芯片、SPI 管脚、触摸总线管脚均不同，唯独触摸芯片 FT6336G 与原规格一致）。
; Waveshare 板到货后，对应配置放到独立分支（如 board/waveshare-esp32-s3-2.8）。
; ============================================================================
board_build.arduino.memory_type = qio_opi   ; 16MB Flash (QIO) + 8MB Octal PSRAM (OPI)，与 Waveshare 板规格相同
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; 显示屏/触摸相关的 build_flags 是板卡专属配置，不放在此通用 scaffold 分支里 ——
; 见各 board/<board-name> 分支（如 board/hosyond-esp32-s3-2.8），各自维护自己的
; USER_SETUP_LOADED / TFT_* / 触摸 I2C 管脚定义，互不冲突。
; C++17：原为 deps/esp32-ant 的要求，该子模块已移除；现由 src/ 自身的代码依赖
; （constexpr 构造、结构化绑定等），保留不变。
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D BOARD_HAS_PSRAM          ; 必须！启用板载 8MB PSRAM，运行图形 UI 内存必选
    -D ARDUINO_USB_CDC_ON_BOOT=1 ; 允许通过板载 Type-C 直接在电脑终端打印串口日志

    ; LVGL 配置头定位：让 lvgl 改用 #include "lv_conf.h"，而非默认的相对路径
    ; "../../lv_conf.h"（那会去 .pio/libdeps/esp32s3/ 下找，必然失败）。
    ; ⚠️ 仅加此宏不够：include/ 默认只对 src/ 生效，编译 .pio/libdeps 下的 lvgl
    ; 库时依然找不到 lv_conf.h，会静默回落到 LVGL 自带默认值（色深、字体全错），
    ; 症状是链接期 undefined reference to `lv_font_montserrat_24'。
    ; 所以必须再显式 -I include，让库的编译单元命中同一份 lv_conf.h。
    -D LV_CONF_INCLUDE_SIMPLE
    -I include

    ; 屏幕底层 SPI 驱动管脚（Hosyond/ES3C28P 板实测管脚，非 Waveshare 原理图）
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1         ; 屏幕显示驱动芯片（非 ST7789！）
    ; 这块面板是 ILI9341V，上电默认反相显示：深色 0x101820 出现为近白色，
    ; 心率区间条的绿色 0x7EF0A5 显示为紫色、琥珀色 0xFFD166 显示为蓝色 ——
    ; 正好是按位取反。TFT_eSPI 在 begin() 里读取这个宏并发送 INVON。
    ; This panel is an ILI9341V, which powers up inverted: near-black
    ; 0x101820 rendered as near-white, and the heart-rate zone bar showed
    ; green 0x7EF0A5 as purple and amber 0xFFD166 as blue -- exact bitwise
    ; inversions, which is what identified it. TFT_eSPI reads this in begin().
    -D TFT_INVERSION_ON=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=11              ; LCD_MOSI
    -D TFT_SCLK=12              ; LCD_SCK
    -D TFT_CS=10                ; LCD_CS
    -D TFT_DC=46                ; LCD_DC
    -D TFT_RST=-1               ; 无独立复位脚，随 ESP32-S3 EN 一起复位
    -D TFT_BL=45                ; LCD_BL（背光管脚）
    -D LOAD_GLCD=1              ; 加载核心字体驱动
    -D SPI_FREQUENCY=40000000   ; 屏幕 SPI 刷屏时钟频率（ILI9341 常规上限附近）

    ; ⚠️ 必须：让 TFT_eSPI 独占一个 SPI host（SPI3/HSPI）。
    ; 缺少此宏时，S3 分支会退化成 `SPIClass& spi = SPI;`（复用 Arduino 全局 SPI
    ; 对象），tft.begin() 会直接 panic 重启（esp_reset_reason()==4，表现为
    ; 屏幕全黑 + 无限重启）。已在本板实测：加上后 begin() 正常返回并可刷屏。
    -D USE_HSPI_PORT

    ; GNSS（UART1）。⚠️ 板上实际接的是 ATGM336H（中科微电子 GPS+BD），不是
    ; CLAUDE.md §2 写的 MAX-M10S —— MAX-M10S 至今没有到货。两者不是同一颗
    ; 芯片：ATGM336H 不认 u-blox 的 UBX 二进制协议，出厂只输出标准 NMEA-0183
    ; 文本，且没有文档记录的方式能切换协议，所以 GPS_Reader.cpp 走的是
    ; NmeaParse.c 这条路径，而不是 UbxParse.c（后者保留，等 MAX-M10S 到货再
    ; 换回来，两者填的是同一个 GPS_Info_t）。
    ;
    ; ⚠️ 管脚选型：GPIO4/GPIO5 曾经是这里的选择，是错的，已改掉。ES3C28P 参考
    ; 设计（ngttai/esp32_s3_es3c28p，CLAUDE.md §2 交叉验证来源之一）把这两个
    ; 脚焊死给了板载 PCM5101 I2S 功放（MCLK=4, BCLK=5）——板子背面那个没有
    ; 印丝印字的 SPEAKER 排针背后接的就是它们，就算固件从没跑过音频代码，
    ; 硬件层面这两个脚也不是空的。CLAUDE.md §2 写的 GPIO43/44 同样不能用：
    ; 那是板子上印着"UART"字样、RXD/TXD/GND/5V 那个排针，本机
    ; USB-Serial-JTAG 串口不可用（见 CLAUDE.md §8），43/44 是唯一还能接
    ; USB-TTL 抓日志的通道。
    ; 板子上唯一还空着、真正引出到排针的是那个印着 IO2/IO3/IO14/IO21 字样的
    ; 4 针扩展排针（同一参考设计文档里标注为"Expansion"）——GNSS 接这里，
    ; RX 用 IO2、TX 用 IO3，IO14/IO21 留空。3.3V/GND 从 I2C 排针（印着
    ; 3.3V/GND/IO15/IO16）借，不接 SCL/SDA 那两根线即可。
    ;
    ; ⚠️ 实验开关：把 GNSS 信号线挪到 I2C 排针（3.3V/GND/IO15/IO16），
    ; 好处是电源和信号共用一个 4 针接头，不用再从两个排针各拉一对线。
    ; 代价是**触摸完全失效**——IO15/IO16 就是 FT6336G 的 SCL/SDA，一组管脚
    ; 只能给一个外设。置 1 时 Touch_Init() 改为把 FT6336G 按在复位状态
    ; （见 hal/Touch.cpp），确保它不会去驱动这两根线。
    ;
    ; 触摸是本板唯一的输入设备，也是深睡唤醒源，所以置 1 之后：不能翻页、
    ; 不能开始/结束骑行、进不了设置页和文件服务器、深睡也醒不过来。
    ; 通过 USB 重新烧录不需要触摸，所以这个开关随时可以改回 0。
    -D PEGASUS_GPS_ON_I2C_HEADER=1
    ; 改回扩展排针时：下面两行换成 RX=2 / TX=3，并把上面的开关置 0。
    ;   -D GPS_UART_RX_PIN=2
    ;   -D GPS_UART_TX_PIN=3
    -D GPS_UART_RX_PIN=16       ; I2C 排针的 SDA 脚 ← 模块 TX
    -D GPS_UART_TX_PIN=15       ; I2C 排针的 SCL 脚 → 模块 RX
    -D GPS_UART_BAUD=9600       ; ATGM336H 出厂默认；没有配置协议可以改它

    ; FT6336G 电容触摸屏（I2C），管脚同样来自 ES3C28P 参考设计
    -D TOUCH_I2C_SDA=16
    -D TOUCH_I2C_SCL=15
    -D TOUCH_INT_PIN=17
    ; RST 必须由固件主动拉高：不释放复位时 FT6336G 完全不应答 I2C，
    ; Touch_Read() 每次都走 ReadReg 失败分支（表现为触摸完全无反应）。
    -D TOUCH_RST_PIN=18
    ; WiFi 文件传输（FileServer.h）。设为 0 可整块移除：约 420KB flash 与 21KB
    ; 静态 RAM 全部来自 WiFi 协议栈，是链接进镜像的代码与预留缓冲区，运行时开关
    ; 省不下来 —— 射频本身已经是按需启动的，关闭状态下没有额外开销可省。
    -D PEGASUS_WIFI_FILES=1

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43                                       ; ILI9341 SPI 显示驱动，与上方 build_flags 的 USER_SETUP_LOADED 管脚配置对接
    lvgl/lvgl @ ^8.3.11                                             ; UI 渲染引擎（PageManager/DataCenter 架构基于此）
    h2zero/NimBLE-Arduino @ ^2.2.3                                  ; BLE 客户端：心率带 / Galaxy Watch 8 / 手机 TBT 导航
    sparkfun/SparkFun u-blox GNSS Arduino Library @ ^2.2.27         ; MAX-M10S 纯 UBX 二进制协议解析（替换 TinyGPSPlus，禁用 NMEA）

; NimBLE 版本说明：^2.2.3。最初选它是为了对齐 deps/esp32-ant 的 BLE 共存示例，
; 那个子模块已随 ANT+ 一起移除，但版本保持不变 —— 心率客户端与 TBT GATT 服务端
; 都是照 2.x API 写的，1.x→2.x 是破坏性变更，回退等于重写这两个模块。
; CLAUDE.md 第 8 节记录的几个 NimBLE 陷阱也都是在这个版本上验证的。

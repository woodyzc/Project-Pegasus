; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; PlatformIO Project Configuration File

[env:esp32s3]
platform = espressif32 @ ^6.6.0  ; 锁定 3.x 稳定版编译平台
board = esp32-s3-devkitc-1       ; 🌟 核心修改：改为最万能、绝不报错的官方标准原生板 ID
framework = arduino
monitor_speed = 115200

; ============================================================================
; 当前目标板：Hosyond ESP32-S3 2.8" 240x320 电容触摸屏（Waveshare 到货前的临时开发板）
; 板卡基准设计型号 ES3C28P，交叉验证来源：
;   - https://github.com/celer/esphome_esp32-s3-2.8-display（该板卖家 hosyond 的 ESPHome 配置）
;   - https://github.com/ngttai/esp32_s3_es3c28p（同一 ES3C28P 参考设计的 BSP）
; ⚠️ 注意：本板与 CLAUDE.md §2 中原定的 Waveshare ESP32-S3-Touch-LCD-2.8 硬件不同
; （显示驱动芯片、SPI 管脚、触摸总线管脚均不同，唯独触摸芯片 FT6336G 与原规格一致）。
; Waveshare 板到货后，对应配置放到独立分支（如 board/waveshare-esp32-s3-2.8）。
; ============================================================================
board_build.arduino.memory_type = qio_opi   ; 16MB Flash (QIO) + 8MB Octal PSRAM (OPI)，与 Waveshare 板规格相同
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; 显示屏/触摸相关的 build_flags 是板卡专属配置，不放在此通用 scaffold 分支里 ——
; 见各 board/<board-name> 分支（如 board/hosyond-esp32-s3-2.8），各自维护自己的
; USER_SETUP_LOADED / TFT_* / 触摸 I2C 管脚定义，互不冲突。
; deps/esp32-ant 要求 C++17（其 PlatformIO 示例同样这样配置）
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D BOARD_HAS_PSRAM          ; 必须！启用板载 8MB PSRAM，运行图形 UI 内存必选
    -D ARDUINO_USB_CDC_ON_BOOT=1 ; 允许通过板载 Type-C 直接在电脑终端打印串口日志

    ; LVGL 配置头定位：让 lvgl 改用 #include "lv_conf.h"，而非默认的相对路径
    ; "../../lv_conf.h"（那会去 .pio/libdeps/esp32s3/ 下找，必然失败）。
    ; ⚠️ 仅加此宏不够：include/ 默认只对 src/ 生效，编译 .pio/libdeps 下的 lvgl
    ; 库时依然找不到 lv_conf.h，会静默回落到 LVGL 自带默认值（色深、字体全错），
    ; 症状是链接期 undefined reference to `lv_font_montserrat_24'。
    ; 所以必须再显式 -I include，让库的编译单元命中同一份 lv_conf.h。
    -D LV_CONF_INCLUDE_SIMPLE
    -I include

    ; 屏幕底层 SPI 驱动管脚（Hosyond/ES3C28P 板实测管脚，非 Waveshare 原理图）
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1         ; 屏幕显示驱动芯片（非 ST7789！）
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=11              ; LCD_MOSI
    -D TFT_SCLK=12              ; LCD_SCK
    -D TFT_CS=10                ; LCD_CS
    -D TFT_DC=46                ; LCD_DC
    -D TFT_RST=-1               ; 无独立复位脚，随 ESP32-S3 EN 一起复位
    -D TFT_BL=45                ; LCD_BL（背光管脚）
    -D LOAD_GLCD=1              ; 加载核心字体驱动
    -D SPI_FREQUENCY=40000000   ; 屏幕 SPI 刷屏时钟频率（ILI9341 常规上限附近）

    ; ⚠️ 必须：让 TFT_eSPI 独占一个 SPI host（SPI3/HSPI）。
    ; 缺少此宏时，S3 分支会退化成 `SPIClass& spi = SPI;`（复用 Arduino 全局 SPI
    ; 对象），tft.begin() 会直接 panic 重启（esp_reset_reason()==4，表现为
    ; 屏幕全黑 + 无限重启）。已在本板实测：加上后 begin() 正常返回并可刷屏。
    -D USE_HSPI_PORT

    ; FT6336G 电容触摸屏（I2C），管脚同样来自 ES3C28P 参考设计
    -D TOUCH_I2C_SDA=16
    -D TOUCH_I2C_SCL=15
    -D TOUCH_INT_PIN=17
    ; RST 必须由固件主动拉高：不释放复位时 FT6336G 完全不应答 I2C，
    ; Touch_Read() 每次都走 ReadReg 失败分支（表现为触摸完全无反应）。
    -D TOUCH_RST_PIN=18

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43                                       ; ILI9341 SPI 显示驱动，与上方 build_flags 的 USER_SETUP_LOADED 管脚配置对接
    lvgl/lvgl @ ^8.3.11                                             ; UI 渲染引擎（PageManager/DataCenter 架构基于此）
    h2zero/NimBLE-Arduino @ ^2.2.3                                  ; BLE 客户端：心率带 / Galaxy Watch 8 / 手机 TBT 导航
    sparkfun/SparkFun u-blox GNSS Arduino Library @ ^2.2.27         ; MAX-M10S 纯 UBX 二进制协议解析（替换 TinyGPSPlus，禁用 NMEA）
    symlink://deps/esp32-ant/components/ant                         ; 纯软件 ANT+ 协议栈 + ESP32-S3 射频 PHY（子模块内的本地库，非注册表包）

; NimBLE 版本说明：此前锁定 ^1.4.1，现对齐到 ^2.2.3 —— deps/esp32-ant 的三个
; BLE 相关示例（尤其 platformio_ble_coexist：ANT+ 与 BLE 同时在线，正是
; CLAUDE.md §3 最终需要的形态）全部是针对 ^2.2.3 验证的。NimBLE 1.x→2.x 属破坏性
; API 变更，趁工程尚未写任何 BLE 代码时切换，代价为零；等 BLE 任务写完再迁移则要返工。
; 注：ANT 库自身并不调用 NimBLE API（它直接 hook ESP-IDF 蓝牙控制器，源码中的
; NimBLE 字样只出现在注释里），所以该版本选择只影响我们自己的 BLE 代码。

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; PlatformIO Project Configuration File

[env:esp32s3]
platform = espressif32 @ ^6.6.0  ; 锁定 3.x 稳定版编译平台
board = esp32-s3-devkitc-1       ; 🌟 核心修改：改为最万能、绝不报错的官方标准原生板 ID
framework = arduino
monitor_speed = 115200

build_flags =
    -D BOARD_HAS_PSRAM          ; 必须！启用板载 8MB PSRAM，运行图形 UI 内存必选
    -D ARDUINO_USB_CDC_ON_BOOT=1 ; 允许通过板载 Type-C 直接在电脑终端打印串口日志
    -I src
    -D LV_CONF_PATH="lv_conf.h"

    ; 屏幕底层 SPI 驱动管脚重映射（根据微雪 2.8 官方原理图定义）
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1          ; 屏幕显示驱动芯片
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=45              ; LCD_MOSI 
    -D TFT_SCLK=40              ; LCD_SCK
    -D TFT_CS=42                ; LCD_CS
    -D TFT_DC=41                ; LCD_DC
    -D TFT_RST=39               ; LCD_RST
    -D TFT_BL=5                 ; LCD_BL（背光管脚）
    -D LOAD_GLCD=1              ; 加载核心字体驱动
    -D SPI_FREQUENCY=27000000   ; 屏幕 SPI 刷屏时钟频率

lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3  ; 自动拉取 M10S GPS 核心解析库
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ ^8.3.11
